[project]
name = "grantproof"
version = "0.1.0"
description = "Standing grants, request-bound proof of human authorization, and revocation push for agent actions."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0.0",
    "PyJWT>=2.9.0",
    "webauthn>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grantproof"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
